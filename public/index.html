<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Prospero Vault</title>
    <link rel="icon" href="/icon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <canvas id="vault-bg" aria-hidden="true"></canvas>
    <div class="shell">
      <nav class="rail">
        <div class="brand">
          <span class="mark"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 6 L29 15 L19 15 Z"/><circle cx="38" cy="24" r="5"/><rect x="5" y="19" width="10" height="10" rx="1.5"/><path d="M20.5 34 L27.5 41 M27.5 34 L20.5 41"/></svg></span>
          <span class="brand-text">PROSPERO<em>VAULT</em></span>
        </div>

        <button class="nav" data-view="library" data-focus>
          <span class="glyph"><svg viewBox="0 0 24 24" stroke-width="1.7"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg></span><span>Library</span>
        </button>
        <button class="nav" data-view="forge" data-focus>
          <span class="glyph"><svg viewBox="0 0 24 24" stroke-width="1.7"><path d="M12 3.6l7.4 3.8v9.2L12 20.4 4.6 16.6V7.4L12 3.6z"/><path d="M4.8 7.6L12 11.4l7.2-3.8M12 11.4v8.8"/></svg></span><span>Convert</span>
        </button>
        <button class="nav" data-view="console" data-focus>
          <span class="glyph"><svg viewBox="0 0 24 24" stroke-width="1.7"><rect x="3" y="4.6" width="18" height="12.4" rx="1.8"/><path d="M8.4 20.4h7.2M12 17v3.4"/></svg></span><span>Console</span>
        </button>
        <button class="nav" data-view="settings" data-focus>
          <span class="glyph"><svg viewBox="0 0 24 24" stroke-width="1.7"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 13.6a7.6 7.6 0 000-3.2l1.7-1.3-1.8-3.1-2 .8a7.7 7.7 0 00-2.8-1.6L14.2 3h-4.4l-.3 2.2a7.7 7.7 0 00-2.8 1.6l-2-.8L2.9 9.1l1.7 1.3a7.6 7.6 0 000 3.2L2.9 14.9l1.8 3.1 2-.8a7.7 7.7 0 002.8 1.6l.3 2.2h4.4l.3-2.2a7.7 7.7 0 002.8-1.6l2 .8 1.8-3.1-1.7-1.3z"/></svg></span><span>Settings</span>
        </button>

        <div class="rail-foot">
          <div class="lan" id="lanHint">—</div>
          <span class="ver" id="railVersion">v0.1.0</span>
        </div>
      </nav>

      <main class="main">
        <header class="topbar">
          <div class="heading">
            <h1 id="viewTitle">Library</h1>
            <p id="viewSub">Everything you own, in one place.</p>
          </div>
          <div class="pills" id="pills"></div>
        </header>
        <div class="content" id="content"></div>
      </main>
    </div>

    <div class="scrim" id="scrim" hidden></div>
    <aside class="drawer" id="drawer" hidden aria-label="Game details"></aside>
    <div class="toast" id="toast" hidden></div>

    <script src="/app.js"></script>
    <script>
      /* PS5-style ambient dust over the spotlit backdrop. */
      (function vaultBg(){
        var c = document.getElementById('vault-bg');
        if (!c || !c.getContext) return;
        var x = c.getContext('2d');
        var reduce = matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        var dpr = Math.min(devicePixelRatio || 1, 2), w = 0, h = 0, m = [];
        var tints = ['255,255,255','198,214,255','255,226,208','206,255,240'];
        function seed(){
          var n = Math.round(Math.min(110, Math.max(40, w * h / 28000)));
          m = [];
          for (var i = 0; i < n; i++) m.push({ x: Math.random()*w, y: Math.random()*h,
            r: 0.6 + Math.random()*2.2, a: 0.04 + Math.random()*0.24,
            vx: (Math.random()-0.5)*0.1, vy: -(0.04 + Math.random()*0.2),
            t: tints[(Math.random()*tints.length)|0], tw: Math.random()*6.28 });
        }
        function resize(){ w = c.width = innerWidth; h = c.height = innerHeight;
          c.width = w*dpr; c.height = h*dpr; c.style.width = w+'px'; c.style.height = h+'px';
          x.setTransform(dpr,0,0,dpr,0,0); seed(); }
        function draw(){
          x.clearRect(0,0,w,h);
          for (var i=0;i<m.length;i++){ var p=m[i];
            if(!reduce){ p.x+=p.vx; p.y+=p.vy; p.tw+=0.01;
              if(p.y<-8){p.y=h+8;p.x=Math.random()*w;} if(p.x<-8)p.x=w+8; else if(p.x>w+8)p.x=-8; }
            var tw = reduce?1:(0.65+0.35*Math.sin(p.tw));
            x.beginPath(); x.arc(p.x,p.y,p.r,0,6.2832);
            x.fillStyle='rgba('+p.t+','+(p.a*tw).toFixed(3)+')';
            x.shadowBlur=p.r*3; x.shadowColor='rgba('+p.t+',0.5)'; x.fill();
          }
          x.shadowBlur=0; if(!reduce) requestAnimationFrame(draw);
        }
        var rt; addEventListener('resize', function(){ clearTimeout(rt); rt=setTimeout(resize,160); });
        resize(); requestAnimationFrame(draw);
      })();
    </script>
  </body>
</html>
